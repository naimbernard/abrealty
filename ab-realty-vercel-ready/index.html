<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AB Realty is a boutique Goa real estate advisory for villas, apartments, land, rentals and investment opportunities." />
  <title>AB Realty | Goa Real Estate Advisory</title>
  <style>
    :root{--cream:#f6f3e8;--ivory:#fbfaf3;--olive:#605a25;--gold:#988334;--black:#050503;--text:#17150e;--muted:#6b675b;--line:rgba(20,18,10,.12);--shadow:0 24px 70px rgba(12,10,4,.18);--radius:20px;--ease:cubic-bezier(.19,1,.22,1)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ivory);color:var(--text);font-family:Inter,Arial,sans-serif;cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><path fill="%23988334" d="M3 13.5 14 4l11 9.5v10a1.5 1.5 0 0 1-1.5 1.5H18v-7h-8v7H4.5A1.5 1.5 0 0 1 3 23.5z"/><path fill="none" stroke="%23fff" stroke-width="1.5" d="M6 14 14 7l8 7"/></svg>') 7 7,auto}button,a,input,textarea,select{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}img,video{max-width:100%;display:block}.built{height:28px;display:grid;place-items:center;background:#fff;font-size:12px;color:#111;position:relative;z-index:9}.preloader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#050503;transition:opacity .9s var(--ease),visibility .9s}.preloader.hide{opacity:0;visibility:hidden}.preloader img{width:min(360px,72vw);filter:drop-shadow(0 24px 45px rgba(255,255,255,.09));animation:logoPulse 1.6s var(--ease) both}@keyframes logoPulse{0%{opacity:0;transform:scale(.94)}55%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1.02)}}
    header{position:sticky;top:0;z-index:50;height:88px;background:#050503;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,5vw,56px);border-bottom:12px solid #d6d0ad}header .brand{background:0;border:0;color:#fff;font-weight:900;font-size:clamp(24px,2.1vw,32px);letter-spacing:.02em}nav{display:flex;align-items:center;gap:28px}nav button,.mobile-menu button{background:0;border:0;color:#fff;font-size:14px;letter-spacing:.02em}.cta{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:10px;padding:16px 22px;font-weight:800;transition:transform .45s var(--ease),box-shadow .45s var(--ease),background .45s}.cta:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(0,0,0,.18)}.cta.gold{background:var(--gold);color:#fff}.cta.light{background:#fff;color:#17150e}.cta.dark{background:#120f04;color:#fff}.hamb{display:none;background:0;border:0;color:#fff}.mobile-menu{position:fixed;inset:0;z-index:90;background:#050503;display:flex;flex-direction:column;align-items:flex-start;gap:26px;padding:34px}.mobile-menu .close{align-self:flex-end}.section{padding:clamp(72px,9vw,130px) clamp(24px,6vw,72px)}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin:0 0 28px}.hero{min-height:calc(100vh - 28px);position:relative;display:flex;align-items:center;overflow:hidden;background:#141208}.hero video,.hero .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.hero .hero-img{background:url('assets/hero-screen.png') center/cover no-repeat;opacity:.95}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.68),rgba(0,0,0,.34),rgba(0,0,0,.22));z-index:1}.hero-content{position:relative;z-index:2;color:#fff;padding-left:clamp(28px,6vw,96px);padding-right:24px;max-width:960px}.hero h1{font-size:clamp(54px,7vw,104px);line-height:1.15;margin:0 0 32px;font-weight:900;letter-spacing:-.045em}.hero p{font-size:clamp(24px,2.35vw,42px);line-height:1.35;margin:0 0 48px;color:#fffdf1}.reveal{opacity:0;transform:translateY(38px);animation:rise 1.15s var(--ease) forwards}.reveal:nth-child(2){animation-delay:.14s}@keyframes rise{to{opacity:1;transform:none}}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(42px,6vw,90px);align-items:center}.about{background:#fbfaf0}.about h2,.section-title{font-size:clamp(46px,4.8vw,72px);font-weight:300;line-height:1.18;letter-spacing:-.04em;margin:0 0 34px}.about p,.lead{font-size:18px;line-height:1.65;color:#5f5b50;margin:0 0 24px}.image-card{border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#ddd}.image-card img{width:100%;height:100%;min-height:520px;object-fit:cover}.instagram{background:#d5d0af;padding:92px clamp(24px,5vw,56px)}.instagram-inner{background:#fffdf4;padding:36px 0 0;overflow:hidden}.instagram p{text-align:center;font-size:24px;margin:0 0 34px}.rail{display:flex;gap:18px;overflow-x:auto;padding:0 40px 38px;scroll-snap-type:x mandatory}.insta-card{position:relative;min-width:260px;height:360px;border-radius:0;overflow:hidden;scroll-snap-align:center;background:#ddd}.insta-card img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}.insta-card:hover img{transform:scale(1.06)}.insta-card span{position:absolute;inset:auto 18px 18px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:10px 14px;font-size:13px;backdrop-filter:blur(8px)}.properties .head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:72px}.properties h2{font-size:clamp(48px,5vw,78px);font-weight:300;letter-spacing:-.05em;margin:0}.prop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px}.prop-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.06);transition:transform .55s var(--ease),box-shadow .55s var(--ease)}.prop-card:hover{transform:translateY(-8px);box-shadow:var(--shadow)}.prop-card img{width:100%;height:420px;object-fit:cover}.prop-body{padding:28px}.badge{display:inline-flex;background:#eee8cc;color:#514915;border-radius:99px;padding:8px 12px;font-size:12px;font-weight:900;margin-bottom:18px}.prop-body h3{font-size:30px;margin:0 0 12px;letter-spacing:-.03em}.prop-body p{line-height:1.55;color:#605d52}.meta{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.meta span{border:1px solid var(--line);border-radius:99px;padding:9px 12px;color:#565247;font-size:13px}.services{background:var(--cream)}.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.service-card{min-height:360px;background:#605a25;color:#fff;border-radius:12px;padding:44px 38px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .55s var(--ease),background .55s}.service-card:hover{transform:translateY(-8px);background:#6c642b}.icon{width:64px;height:64px;border:1px solid #fff;border-radius:8px;display:grid;place-items:center;font-size:26px}.service-card h3{font-size:18px;margin:0 0 20px}.service-card p{font-size:18px;line-height:1.5;color:#f4f0dd;margin:0}.footer{background:#8d8035;color:#fff;padding:80px clamp(24px,5vw,54px) 0}.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;min-height:260px}.footer h2{font-size:32px;line-height:1.22;margin:0 0 44px}.footer a,.footer p{color:#f8f4df}.bottom{background:#070700;margin:40px calc(clamp(24px,5vw,54px) * -1) 0;padding:24px clamp(24px,5vw,54px);display:flex;justify-content:space-between;font-size:14px}.page-hero{padding:110px clamp(24px,6vw,72px) 70px;background:#fbfaf0}.page-hero h1{font-size:clamp(54px,7vw,110px);letter-spacing:-.06em;line-height:1;margin:0 0 24px}.page-hero p{font-size:22px;line-height:1.5;color:#5f5b50;max-width:800px}.form-wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px}.form{background:#fff;border-radius:18px;padding:32px;box-shadow:0 16px 50px rgba(0,0,0,.08)}.form label{display:block;font-size:13px;font-weight:800;margin:18px 0 8px}.form input,.form textarea,.form select{width:100%;border:0;border-bottom:1px solid #c9c4b4;background:transparent;padding:14px 0;outline:0}.admin-panel{max-width:1000px;margin:0 auto}.admin-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.admin-list{margin-top:30px;display:grid;gap:14px}.admin-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;justify-content:space-between;gap:20px}.hidden{display:none!important}
    @media(max-width:900px){header{height:78px;padding:0 22px}nav{display:none}.hamb{display:block}.hero{min-height:760px}.hero h1{font-size:56px}.hero p{font-size:24px}.grid2,.form-wrap{grid-template-columns:1fr}.prop-grid,.service-grid{grid-template-columns:1fr}.properties .head{display:block}.properties .head .cta{margin-top:28px}.image-card img{min-height:380px}.insta-card{min-width:230px;height:320px}.footer-grid{grid-template-columns:1fr 1fr}.bottom{display:block}.bottom span{display:block;margin-top:12px}.admin-row{grid-template-columns:1fr}}
    @media(max-width:540px){.built{font-size:11px}.hero{min-height:690px}.hero-content{padding-left:24px}.hero h1{font-size:44px}.hero p{font-size:19px}.section{padding:58px 20px}.about h2,.section-title,.properties h2{font-size:40px}.service-card{min-height:280px;padding:30px 24px}.prop-card img{height:280px}.footer-grid{grid-template-columns:1fr}.page-hero h1{font-size:48px}.page-hero{padding:70px 20px 40px}.rail{padding-left:20px}.footer{padding-left:24px;padding-right:24px}}
  </style>
</head>
<body>
  <div class="preloader" id="preloader"><img src="assets/logo-original.png" alt="AB Realty logo"></div>
  <div class="built">Built on VERCEL</div>
  <header>
    <button class="brand" onclick="go('/')">AB REALTY</button>
    <nav><button onclick="go('/properties')">PROPERTIES</button><button onclick="go('/about')">ABOUT US</button><button onclick="go('/requirements')">AB Realty Requirements</button><button class="cta gold" onclick="go('/enquire')">Enquire here ↘</button></nav>
    <button class="hamb" onclick="menu(true)">☰</button>
  </header>
  <div id="mobileMenu" class="mobile-menu hidden"><button class="close" onclick="menu(false)">✕</button><button onclick="go('/properties')">PROPERTIES</button><button onclick="go('/about')">ABOUT US</button><button onclick="go('/requirements')">AB Realty Requirements</button><button class="cta gold" onclick="go('/enquire')">Enquire here ↘</button></div>
  <div id="app"></div>
  <script>
    const WA='https://wa.me/919373136048?text=Hey%20Amar%2C%20I%20am%20interested%20in%20one%20of%20your%20real%20estate%20listings.';
    const baseProps=[
      {title:'Rare 2BHK Vianaar Villa Resale',badge:'Rare Resale',location:'La Luciana, Siolim, North Goa',price:'Get in Touch',image:'assets/landing-wide.png',summary:'Rare 2BHK Vianaar villa resale in La Luciana, Siolim, offering private pool living in a sold-out luxury community.',highlights:'Private pool, garden, skylights, gated enclave, Indo-Portuguese design, near Morjim Beach.'},
      {title:'Rare 2BHK Vianaar Apartment Resale',badge:'Rare Resale',location:'Nerul, North Goa',price:'Get in Touch',image:'assets/landing-vertical.png',summary:'Rare 2BHK corner apartment in a sold-out Vianaar development, with paddy field views, private plunge pool and an exceptionally large garden.',highlights:'92.4 sqm carpet, 125.4 sqm built-up, 144 sqm private garden, corner unit, semi-furnished, near Candolim and Coco Beach.'},
      {title:'Luxury 3BHK Villa with Private Pool',badge:'Premium Villa',location:'Pinto Rosario Square, Porvorim, North Goa',price:'Get in Touch',image:'assets/brand-ad.png',summary:'Fully furnished 3BHK villa in Pinto Rosario Square, offering private pool living in a prestigious gated community in Porvorim.',highlights:'220 sqm built area, private pool, fully furnished, fully air-conditioned, maid’s quarters, two common pools, gym, landscaped spaces.'}
    ];
    const services=[['⌂','Property Buying Assistance','Guided support for buyers looking for villas, apartments, land or investment properties across Goa.'],['◇','Property Sales Support','Helping owners position, market and connect their property with serious, qualified buyers.'],['□','Rental & Lease Assistance','Long-term rentals, premium leases and tenant-owner matching for homes across Goa.'],['⚒','Contractor Coordination','Support with local contractors, site visits and project coordination to keep work moving smoothly.'],['◈','Renovation Support','Connecting clients with trusted renovation teams for upgrades, repairs and property improvements.'],['✦','Bespoke Needs','We understand not all needs are the same. AB Realty offers bespoke property support designed around your personal goals, whether searching for a home, selling, renovating or managing an investment in Goa.']];
    const requirements=[['Premium 4BHK Villa Required','Premium Rental','North Goa','Up to ₹2.25L/month','Family seeking long-term villa with garden, bright interiors, parking and peaceful surroundings.'],['Urgent 3BHK Rental Required','Urgent Rental','Miramar / Caranzalem / Campal','₹60K–₹80K/month','Family seeking 3BHK apartment or villa, unfurnished, with wardrobes, kitchen cabinets and parking.']];
    function getProps(){try{return JSON.parse(localStorage.getItem('ab_props'))||baseProps}catch(e){return baseProps}}
    function setProps(p){localStorage.setItem('ab_props',JSON.stringify(p))}
    function go(path){history.pushState(null,'',path); menu(false); render(); scrollTo({top:0,behavior:'smooth'})}
    function menu(show){document.getElementById('mobileMenu').classList.toggle('hidden',!show)}
    addEventListener('popstate',render); addEventListener('load',()=>setTimeout(()=>document.getElementById('preloader').classList.add('hide'),1200));
    function layout(inner){return inner+footer()}
    function propertyCard(p,i){return `<article class="prop-card reveal"><img src="${p.image}" alt="${p.title}"><div class="prop-body"><span class="badge">${p.badge}</span><h3>${p.title}</h3><p><b>${p.location}</b> • ${p.price}</p><p>${p.summary}</p><div class="meta"><span>${p.highlights}</span></div><a class="cta dark" href="${WA}" target="_blank">Enquire Now ↗</a></div></article>`}
    function home(){const props=getProps();return layout(`<section class="hero"><div class="hero-img"></div><div class="hero-content"><div class="reveal"><h1>Goa Real Estate,<br>Made Clear</h1></div><div class="reveal"><p>Boutique property advisory for villas, apartments, land<br>and investment opportunities across Goa.</p></div><button class="cta light" onclick="go('/properties')">Find your home ↘</button></div></section><section class="about grid2 section"><div><p class="eyebrow">ABOUT AB REALTY</p><h2>Trusted Boutique Real Estate Advisory in Goa</h2><p>Founded by Amar Bernard, AB Realty is a boutique property consultancy built on trust, transparency and personalised guidance.</p><p>With roots in London and years of family experience in Goa’s property market, Amar brings a rare mix of international perspective and local insight. AB Realty works with HNIs, NRIs and serious buyers looking for luxury villas, apartments, land and high-value investment opportunities.</p><p>Every property is carefully vetted for location, design, legal strength, resale potential and long-term value, giving clients safer decisions and a smoother buying experience.</p><button class="cta dark" onclick="go('/about')">READ MORE ↘</button></div><div class="image-card"><img src="assets/landing-vertical.png" alt="AB Realty landing image holder"></div></section><section class="instagram"><div class="instagram-inner"><p>Follow us on Instagram&nbsp; <a href="https://www.instagram.com/ab_realty_in" target="_blank">@ab_realty_in</a></p><div class="rail">${[0,1,2,0,1].map((x)=>`<a class="insta-card" target="_blank" href="https://www.instagram.com/ab_realty_in"><img src="${['assets/brand-ad.png','assets/landing-wide.png','assets/landing-vertical.png'][x]}"><span>View on Instagram</span></a>`).join('')}</div></div></section><section class="properties section"><p class="eyebrow">FEATURED PROPERTIES</p><div class="head"><h2>We Find Spaces You’ll Love</h2><button class="cta dark" onclick="go('/properties')">ALL PROPERTIES ↘</button></div><div class="prop-grid">${props.slice(0,2).map(propertyCard).join('')}</div></section><section class="services section"><h2 class="section-title">We Offer a Range of Services<br>Tailored to Your Needs</h2><div class="service-grid">${services.map(s=>`<div class="service-card"><div class="icon">${s[0]}</div><div><h3>${s[1]}</h3><p>${s[2]}</p></div></div>`).join('')}</div></section>`)}
    function propertiesPage(){const props=getProps();return layout(`<section class="page-hero"><p class="eyebrow">FEATURED PROPERTIES</p><h1>Our Properties</h1><p>We only share properties we believe are worth your time. From homes and rentals to land and resale opportunities, AB Realty helps you explore Goa properties with clear information, honest guidance and no pressure.</p></section><section class="section"><div class="prop-grid">${props.map(propertyCard).join('')}</div></section>`)}
    function about(){return layout(`<section class="page-hero"><p class="eyebrow">ABOUT AB REALTY</p><h1>About AB Realty</h1><p>AB Realty is a boutique Goa real estate consultancy founded by Amar Bernard, helping clients buy, sell, rent, invest and manage property with honest guidance, curated opportunities and trusted local support.</p></section><section class="section grid2"><div><h2 class="section-title">A Responsible Future for Goa Real Estate</h2><p class="lead">Goa is one of the most special places in the world, and real estate here has to be handled with respect. It is not just about buying land, selling homes or building value. It is about understanding the balance between people, property, nature and the future of the place we call home.</p><p class="lead">At AB Realty, I do not believe in pushing every listing. I believe in showing properties that make sense — homes, land, rentals and investment opportunities that are approached with honesty, care and practical guidance.</p><p class="lead">The goal is simple: to make real estate in Goa feel clearer, safer and more personal, while respecting the land, the community and the future being built here.</p><p><b>Amar Bernard</b><br>Founder, AB Realty</p></div><div class="image-card"><img src="assets/landing-wide.png"></div></section><section class="section"><h2 class="section-title">Accountability</h2><p class="lead">We take responsibility for the guidance we give and the people we connect you with. From property details to contractors, renovations and local support, AB Realty aims to keep communication clear, expectations realistic and every step handled with care.</p></section>`)}
    function reqPage(){return layout(`<section class="page-hero"><p class="eyebrow">AB Realty Requirements</p><h1>Live Property Requirements</h1><p>Explore active property requirements from AB Realty’s client network. If you own or represent a property that matches one of the requirements below, contact Amar directly.</p></section><section class="section"><div class="prop-grid">${requirements.map(r=>`<article class="prop-card"><div class="prop-body"><span class="badge">${r[1]}</span><h3>${r[0]}</h3><p><b>${r[2]}</b> • ${r[3]}</p><p>${r[4]}</p><a class="cta dark" target="_blank" href="https://wa.me/919373136048?text=Hey%20Amar%2C%20I%20have%20a%20match%21">I Have a Match ↗</a></div></article>`).join('')}</div></section>`)}
    function enquire(){return layout(`<section class="page-hero"><p class="eyebrow">Start your property conversation.</p><h1>Your Goa Property Search Starts Here.</h1><p>Share your Requirement with AB Realty & we'll help you move forward with clarity, confidence & trusted insights.</p></section><section class="section form-wrap"><div><h2 class="section-title">Tell Us What You’re Looking For</h2><p class="lead">Whether you’re buying, selling, renting or investing in Goa, share your details and Amar will personally get back to you.</p></div><form class="form" onsubmit="event.preventDefault(); alert('Thank you. Your enquiry has been prepared. Please also contact Amar on WhatsApp for fastest response.'); window.open('${WA}','_blank')"><label>First name*</label><input required><label>Last name*</label><input required><label>Phone Number*</label><input required><label>Subject*</label><input required><label>When are you looking to start?*</label><select required><option>Immediately</option><option>This month</option><option>1-3 months</option><option>Just exploring</option></select><label>What type of real estate are you interested in?</label><textarea rows="4" required></textarea><button class="cta gold" style="margin-top:24px">Submit Enquiry ↗</button></form></section>`)}
    function admin(){let authed=sessionStorage.getItem('ab_admin')==='yes';return layout(`<section class="page-hero"><p class="eyebrow">ADMIN</p><h1>Property Manager</h1><p>Simple admin area for adding and updating properties. Password: abrealty2026</p></section><section class="section admin-panel">${authed?adminPanel():loginBox()}</section>`)}
    function loginBox(){return `<div class="form"><label>Password</label><input id="pass" type="password"><button class="cta dark" style="margin-top:22px" onclick="if(document.getElementById('pass').value==='abrealty2026'){sessionStorage.setItem('ab_admin','yes');render()}else alert('Wrong password')">Login</button></div>`}
    function adminPanel(){return `<div class="form"><div class="admin-row"><div><label>Title</label><input id="pt"></div><div><label>Badge</label><input id="pb"></div><div><label>Location</label><input id="pl"></div><div><label>Price</label><input id="pp" value="Get in Touch"></div><div><label>Image URL</label><input id="pi" value="assets/landing-wide.png"></div><div><label>Highlights</label><input id="ph"></div></div><label>Summary</label><textarea id="ps" rows="4"></textarea><button class="cta gold" style="margin-top:24px" onclick="addProp()">Add Property</button></div><div class="admin-list">${getProps().map((p,i)=>`<div class="admin-item"><div><b>${p.title}</b><br><small>${p.location}</small></div><button class="cta dark" onclick="delProp(${i})">Delete</button></div>`).join('')}</div>`}
    function addProp(){const p={title:pt.value,badge:pb.value,location:pl.value,price:pp.value,image:pi.value||'assets/landing-wide.png',summary:ps.value,highlights:ph.value}; if(!p.title)return alert('Add a title'); const arr=getProps(); arr.unshift(p); setProps(arr); render()}
    function delProp(i){const arr=getProps(); arr.splice(i,1); setProps(arr); render()}
    function footer(){return `<footer class="footer"><div class="footer-grid"><div><h2>AB<br>REALTY</h2><p><a onclick="go('/properties')">PROPERTIES</a></p><p><a onclick="go('/about')">ABOUT US</a></p><p><a onclick="go('/requirements')">AB Realty Requirements</a></p></div><div><p>Contact</p><p><a href="tel:+919373136048">+91 9373136048</a><br>abrealtygoa@gmail.com</p></div><div><p>SOCIALS</p><p><a href="https://www.facebook.com" target="_blank">Facebook</a></p><p><a href="https://www.instagram.com/ab_realty_in" target="_blank">Instagram</a></p><p><a href="https://www.linkedin.com" target="_blank">LinkedIn</a></p></div><div><p>INQUIRIES</p><a class="cta light" href="https://wa.me/919373136048" target="_blank">Speak to Amar ↘</a></div></div><div class="bottom"><span>Privacy Policy &nbsp;&nbsp;&nbsp; Accessibility Statement</span><span>AB Realty 2026 by Mavorra Creative</span></div></footer>`}
    function render(){const path=location.pathname; const app=document.getElementById('app'); if(path.startsWith('/properties')) app.innerHTML=propertiesPage(); else if(path.startsWith('/about')) app.innerHTML=about(); else if(path.startsWith('/requirements')) app.innerHTML=reqPage(); else if(path.startsWith('/enquire')) app.innerHTML=enquire(); else if(path.startsWith('/admin')) app.innerHTML=admin(); else app.innerHTML=home();}
    render();
  </script>
</body>
</html>
