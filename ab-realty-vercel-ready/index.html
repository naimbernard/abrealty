<script>

    const DEFAULT_PROPERTIES=[
      {title:'Rare 2BHK Vianaar Villa Resale',badge:'Rare Resale',location:'La Luciana, Siolim, North Goa',price:'Get in Touch',image:'assets/landing-wide.png',summary:'Rare 2BHK Vianaar villa resale in La Luciana, Siolim, offering private pool living in a sold-out luxury community.',highlights:'114 sqm carpet, 187 sqm built-up, 110 sqm garden, private pool, skylights, gated enclave, near Morjim Beach.',visible:true},
      {title:'Rare 2BHK Vianaar Apartment Resale',badge:'Rare Resale',location:'Nerul, North Goa',price:'Get in Touch',image:'assets/landing-vertical.png',summary:'Rare 2BHK corner apartment in a sold-out Vianaar development, with paddy field views, private plunge pool and an exceptionally large garden.',highlights:'92.4 sqm carpet, 125.4 sqm built-up, 144 sqm private garden, corner unit, possession Feb 2027.',visible:true},
      {title:'Luxury 3BHK Villa with Private Pool',badge:'Premium Villa',location:'Pinto Rosario Square, Porvorim, North Goa',price:'Get in Touch',image:'assets/brand-ad.png',summary:'Fully furnished 3BHK villa in Pinto Rosario Square, offering private pool living in a prestigious gated community in Porvorim.',highlights:'220 sqm built area, private pool, fully furnished, air-conditioned, maid’s quarters, two common pools, gym, security.',visible:true}
    ];
    const services=[['▤','Contractor Coordination','Support with local contractors, site visits and project coordination to keep work moving smoothly.'],['◫','Renovation Support','Connecting clients with trusted renovation teams for upgrades, repairs and property improvements.'],['◇','Bespoke Needs','We understand not all needs are the same. AB Realty offers bespoke property support designed around your personal goals, whether searching for a home, selling, renovating or managing an investment in Goa.']];
    const requirements=[['Premium 4BHK Villa Required','Premium Rental','North Goa','Up to ₹2.25L/month','Family seeking long-term villa with garden, bright interiors, parking and peaceful surroundings.'],['Urgent 3BHK Rental Required','Urgent Rental','Miramar / Caranzalem / Campal','₹60K–₹80K/month','Family seeking 3BHK apartment or villa, unfurnished, with wardrobes, kitchen cabinets and parking.']];

    let propertyCache = DEFAULT_PROPERTIES;
    let sb = null;

    function supabaseReady(){
      return !!(window.AB_SUPABASE && window.AB_SUPABASE.url && window.AB_SUPABASE.anonKey && window.supabase);
    }
    function client(){
      if(!supabaseReady()) return null;
      if(!sb) sb = window.supabase.createClient(window.AB_SUPABASE.url, window.AB_SUPABASE.anonKey);
      return sb;
    }
    async function loadProperties(){
      const c = client();
      if(!c){
        propertyCache = JSON.parse(localStorage.getItem('ab_props') || 'null') || DEFAULT_PROPERTIES;
        return propertyCache;
      }
      const { data, error } = await c.from('properties').select('*').eq('visible', true).order('created_at', { ascending:false });
      if(error){ console.warn(error); propertyCache = DEFAULT_PROPERTIES; return propertyCache; }
      propertyCache = data && data.length ? data.map(mapProperty) : DEFAULT_PROPERTIES;
      return propertyCache;
    }
    function mapProperty(p){
      return {
        id:p.id,
        title:p.title || '',
        badge:p.badge || '',
        location:p.location || '',
        price:p.price || 'Get in Touch',
        image:p.image_url || 'assets/landing-wide.png',
        summary:p.summary || '',
        highlights:p.highlights || '',
        visible:p.visible !== false
      };
    }
    function getProps(){ return propertyCache && propertyCache.length ? propertyCache : DEFAULT_PROPERTIES; }
    function setProps(p){ localStorage.setItem('ab_props',JSON.stringify(p)); propertyCache=p; }

    window.addEventListener('load',()=>setTimeout(()=>document.getElementById('preloader')?.classList.add('hide'),900));
    function go(p){history.pushState(null,'',p);render()}
    window.addEventListener('popstate',render);

    function layout(inner){return inner+footer()}

)">ALL PROPERTIES ↘</button></div><div class="prop-grid">${props.slice(0,2).map(propertyCard).join('')}</div></section><section class="services section"><h2 class="section-title">We Offer a Range of Services<br>Tailored to Your Needs</h2><div class="service-grid">${services.map(s=>`<div class="service-card"><div class="icon">${s[0]}</div><div><h3>${s[1]}</h3><p>${s[2]}</p></div></div>`).join('')}</div></section>`)}
    function propertiesPage(){const props=getProps();return layout(`<section class="page-hero"><p class="eyebrow">FEATURED PROPERTIES</p><h1>Our Properties</h1><p>We only share properties we believe are worth your time. From homes and rentals to land and resale opportunities, AB Realty helps you explore Goa properties with clear information, honest guidance and no pressure.</p></section><section class="section"><div class="prop-grid">${props.map(propertyCard).join('')}</div></section>`)}
    function about(){return layout(`<section class="page-hero"><p class="eyebrow">ABOUT AB REALTY</p><h1>About AB Realty</h1><p>AB Realty is a boutique Goa real estate consultancy founded by Amar Bernard, helping clients buy, sell, rent, invest and manage property with honest guidance, curated opportunities and trusted local support.</p></section><section class="section grid2"><div><h2 class="section-title">A Responsible Future for Goa Real Estate</h2><p class="lead">Goa is one of the most special places in the world, and real estate here has to be handled with respect. It is not just about buying land, selling homes or building value. It is about understanding the balance between people, property, nature and the future of the place we call home.</p><p class="lead">At AB Realty, I do not believe in pushing every listing. I believe in showing properties that make sense — homes, land, rentals and investment opportunities that are approached with honesty, care and practical guidance.</p><p class="lead">The goal is simple: to make real estate in Goa feel clearer, safer and more personal, while respecting the land, the community and the future being built here.</p><p><b>Amar Bernard</b><br>Founder, AB Realty</p></div><div class="image-card"><img src="assets/landing-wide.png"></div></section><section class="section"><h2 class="section-title">Accountability</h2><p class="lead">We take responsibility for the guidance we give and the people we connect you with. From property details to contractors, renovations and local support, AB Realty aims to keep communication clear, expectations realistic and every step handled with care.</p></section>`)}
    function reqPage(){return layout(`<section class="page-hero"><p class="eyebrow">AB Realty Requirements</p><h1>Live Property Requirements</h1><p>Explore active property requirements from AB Realty’s client network. If you own or represent a property that matches one of the requirements below, contact Amar directly.</p></section><section class="section"><div class="prop-grid">${requirements.map(r=>`<article class="prop-card"><div class="prop-body"><span class="badge">${escapeHtml(r[1])}</span><h3>${escapeHtml(r[0])}</h3><p><b>${escapeHtml(r[2])}</b> • ${escapeHtml(r[3])}</p><p>${escapeHtml(r[4])}</p><a class="cta dark" target="_blank" href="https://wa.me/919373136048?text=Hey%20Amar%2C%20I%20have%20a%20match%21">I Have a Match ↗</a></div></article>`).join('')}</div></section>`)}
    function enquire(){return layout(`<section class="page-hero"><p class="eyebrow">Start your property conversation.</p><h1>Your Goa Property Search Starts Here.</h1><p>Share your Requirement with AB Realty & we'll help you move forward with clarity, confidence & trusted insights.</p></section><section class="section form-wrap"><div><h2 class="section-title">Tell Us What You’re Looking For</h2><p class="lead">Whether you’re buying, selling, renting or investing in Goa, share your details and Amar will personally get back to you.</p></div><form class="form" onsubmit="event.preventDefault(); alert('Thank you. Please contact Amar on WhatsApp for fastest response.'); window.open('${WA}','_blank')"><label>First name*</label><input required><label>Last name*</label><input required><label>Phone Number*</label><input required><label>Subject*</label><input required><label>When are you looking to start?*</label><select required><option>Immediately</option><option>This month</option><option>1-3 months</option><option>Just exploring</option></select><label>What type of real estate are you interested in?</label><textarea rows="4" required></textarea><button class="cta gold" style="margin-top:24px">Submit Enquiry ↗</button></form></section>`)}
    function admin(){return layout(`<section class="page-hero"><p class="eyebrow">ADMIN</p><h1>Property Manager</h1><p>Add and delete properties quickly from phone, tablet or laptop. When Supabase is connected, changes go live for every visitor.</p></section><section class="section admin-panel" id="adminArea"><div class="notice">Loading admin...</div></section>`)}
    async function mountAdmin(){
      const area=document.getElementById('adminArea');
      if(!area) return;
      const c=client();
      if(!c){
        area.innerHTML=`<div class="notice danger"><b>Supabase is not connected yet.</b><br>Open <code>index.html</code>, paste your Supabase URL and anon key into <code>window.AB_SUPABASE</code>, then redeploy. The SQL setup file is included at <code>supabase/schema.sql</code>.</div>${localAdminPanel()}`;
        return;
      }
      const { data:{ session } } = await c.auth.getSession();
      if(!session){ area.innerHTML=supabaseLoginBox(); return; }
      await renderSupabaseAdmin();
    }
    function supabaseLoginBox(){
      return `<div class="form"><div class="notice"><b>Admin Login</b><br>Use the email and password you create in Supabase Auth.</div><label>Email</label><input id="adminEmail" type="email" autocomplete="email"><label>Password</label><input id="adminPassword" type="password" autocomplete="current-password"><div class="admin-actions"><button class="cta dark" onclick="supabaseLogin()">Login</button></div></div>`;
    }
    async function supabaseLogin(){
      const c=client();
      const email=document.getElementById('adminEmail').value.trim();
      const password=document.getElementById('adminPassword').value;
      const { error } = await c.auth.signInWithPassword({ email, password });
      if(error) return alert(error.message);
      await renderSupabaseAdmin();
    }
    async function supabaseLogout(){
      const c=client();
      await c.auth.signOut();
      await mountAdmin();
    }
    async function renderSupabaseAdmin(){
      const area=document.getElementById('adminArea');
      const c=client();
      const { data, error } = await c.from('properties').select('*').order('created_at',{ascending:false});
      if(error){ area.innerHTML=`<div class="notice danger">${escapeHtml(error.message)}</div>`; return; }
      area.innerHTML = propertyForm('addSupabaseProp()') + `<div class="admin-actions"><button class="cta dark" onclick="supabaseLogout()">Logout</button><button class="cta light" onclick="renderSupabaseAdmin()">Refresh</button></div><div class="admin-list">${(data||[]).map((p)=>`<div class="admin-item"><div><b>${escapeHtml(p.title)}</b><br><small>${escapeHtml(p.location || '')} • ${p.visible ? 'Visible' : 'Hidden'}</small></div><button class="cta dark" onclick="deleteSupabaseProp('${p.id}')">Delete</button></div>`).join('')}</div>`;
    }
    function propertyForm(action){
      return `<div class="form"><div class="notice success"><b>Live property editor</b><br>Add the details, click submit, and it will appear in Our Properties automatically.</div><div class="admin-row"><div><label>Title</label><input id="pt" placeholder="Rare 2BHK Vianaar Villa Resale"></div><div><label>Badge</label><input id="pb" placeholder="Rare Resale"></div><div><label>Location</label><input id="pl" placeholder="Siolim, North Goa"></div><div><label>Price</label><input id="pp" value="Get in Touch"></div><div><label>Image URL</label><input id="pi" value="assets/landing-wide.png"></div><div><label>Highlights</label><input id="ph" placeholder="114 sqm carpet, private pool, gated community"></div></div><label>Summary</label><textarea id="ps" rows="4" placeholder="Clean property summary..."></textarea><div class="admin-actions"><button class="cta gold" onclick="${action}">Submit Property ↗</button></div><p class="small-muted">Tip: upload images to Supabase Storage, Wix media, Cloudinary or GitHub assets and paste the image URL here.</p></div>`;
    }
    async function addSupabaseProp(){
      const c=client();
      const p=readForm();
      if(!p.title) return alert('Add a title');
      const { error } = await c.from('properties').insert({
        title:p.title,badge:p.badge,location:p.location,price:p.price,image_url:p.image,summary:p.summary,highlights:p.highlights,visible:true
      });
      if(error) return alert(error.message);
      await loadProperties();
      await renderSupabaseAdmin();
    }
    async function deleteSupabaseProp(id){
      if(!confirm('Delete this property?')) return;
      const c=client();
      const { error } = await c.from('properties').delete().eq('id',id);
      if(error) return alert(error.message);
      await loadProperties();
      await renderSupabaseAdmin();
    }
    function localAdminPanel(){ return propertyForm('addLocalProp()') + `<div class="admin-list">${getProps().map((p,i)=>`<div class="admin-item"><div><b>${escapeHtml(p.title)}</b><br><small>${escapeHtml(p.location)}</small></div><button class="cta dark" onclick="delLocalProp(${i})">Delete</button></div>`).join('')}</div>`}
    function readForm(){return {title:pt.value.trim(),badge:pb.value.trim(),location:pl.value.trim(),price:pp.value.trim()||'Get in Touch',image:pi.value.trim()||'assets/landing-wide.png',summary:ps.value.trim(),highlights:ph.value.trim(),visible:true}}
    function addLocalProp(){const p=readForm(); if(!p.title)return alert('Add a title'); const arr=getProps(); arr.unshift(p); setProps(arr); render()}
    function delLocalProp(i){const arr=getProps(); arr.splice(i,1); setProps(arr); render()}

    function footer(){return `<footer class="footer"><div class="footer-grid"><div><h2>AB<br>REALTY</h2><p><a onclick="go('/properties')">PROPERTIES</a></p><p><a onclick="go('/about')">ABOUT US</a></p><p><a onclick="go('/requirements')">AB Realty Requirements</a></p></div><div><p>Contact</p><p><a href="tel:+919373136048">+91 9373136048</a><br>abrealtygoa@gmail.com</p></div><div><p>SOCIALS</p><p><a href="https://www.facebook.com" target="_blank">Facebook</a></p><p><a href="https://www.instagram.com/ab_realty_in" target="_blank">Instagram</a></p><p><a href="https://www.linkedin.com" target="_blank">LinkedIn</a></p></div><div><p>INQUIRIES</p><a class="cta light" href="https://wa.me/919373136048" target="_blank">Speak to Amar ↘</a></div></div><div class="bottom"><span>Privacy Policy &nbsp;&nbsp;&nbsp; Accessibility Statement</span><span>AB Realty 2026 by Mavorra Creative</span></div></footer>`}
    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
    async function render(){
      const path=location.pathname;
      await loadProperties();
      const app=document.getElementById('app');
      if(path.startsWith('/properties')) app.innerHTML=propertiesPage();
      else if(path.startsWith('/about')) app.innerHTML=about();
      else if(path.startsWith('/requirements')) app.innerHTML=reqPage();
      else if(path.startsWith('/enquire')) app.innerHTML=enquire();
      else if(path.startsWith('/admin')) { app.innerHTML=admin(); await mountAdmin(); }
      else app.innerHTML=home();
    }
    render();
  </script>

</body>
</html>
